[package]
name = "pinecone-server"
description = "TwoGG Pinecone – Server für Neuigkeiten, TwoGG-Modpacks und Freunde, mit Admin-Oberfläche"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wheatley2056/twogg-pinecone-server"
publish = false

[[bin]]
name = "pinecone-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
strip = true
